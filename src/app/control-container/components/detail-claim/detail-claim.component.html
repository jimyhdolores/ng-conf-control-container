<div class="detail-claim">
	<h1 class="detail-claim__title">Detalle del Reclamo</h1>
	@if (form) {
		<form class="detail-claim__form" [formGroup]="form">
			<tui-textfield tuiTextfieldSize="m">
				<label tuiLabel>Producto</label>
				<input tuiInput formControlName="product" type="text" />
			</tui-textfield>

			<tui-textfield>
				<label tuiLabel>Detalle del reclamo</label>
				<textarea tuiTextarea formControlName="claim"></textarea>
			</tui-textfield>
		</form>
	}
</div>
