<div class="contact-information">
	<h1 class="contact-information__title">Datos de Contacto</h1>
	<form class="contact-information__form" [formGroup]="form">
		<tui-textfield tuiTextfieldSize="m">
			<label tuiLabel>Email</label>
			<input tuiInput autocomplete="email" formControlName="email" type="email" />
		</tui-textfield>
		<tui-error formControlName="email" />

		<tui-textfield tuiTextfieldSize="m">
			<label tuiLabel>Celular</label>
			<input tuiInput formControlName="phone" type="text" />
		</tui-textfield>
		<tui-error formControlName="phone" />

		<tui-textfield tuiTextfieldSize="m">
			<label tuiLabel>Dirección</label>
			<input tuiInput formControlName="address" type="text" />
		</tui-textfield>
		<tui-error formControlName="address" />
	</form>
</div>
