<div class="personal-information">
	<h1 class="personal-information__title">Informacion personal</h1>
	<div class="personal-information__form">
		<tui-textfield tuiTextfieldSize="m">
			<label tuiLabel>Nombres</label>
			<input tuiInput [formField]="form.names" type="text" />
		</tui-textfield>
		<tui-error [formField]="form.names" />

		<tui-textfield tuiTextfieldSize="m">
			<label tuiLabel>Apellido Paterno</label>
			<input tuiInput [formField]="form.paternalSurname" type="text" />
		</tui-textfield>
		<tui-error [formField]="form.paternalSurname" />

		<tui-textfield tuiTextfieldSize="m">
			<label tuiLabel>Apellido Materno</label>
			<input tuiInput [formField]="form.maternalSurname" type="text" />
		</tui-textfield>
		<tui-error [formField]="form.maternalSurname" />

		<tui-textfield tuiTextfieldSize="m">
			<label tuiLabel>Nro. DNI</label>
			<input tuiInput [formField]="form.dni" type="text" inputmode="numeric" />
		</tui-textfield>
		<tui-error [formField]="form.dni" />
	</div>
</div>
