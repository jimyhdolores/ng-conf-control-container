<h1>Control Value Accesor</h1>

<div class="claim-book-page">
	<form class="claim-book-page__form" (submit)="save()">
		<app-personal-information-cva [formField]="form.personalInformation" />
		<app-contact-information-cva [formField]="form.contactInformation" />
		<app-detail-claim-cva [formField]="form.detailClaim" />

		<button size="s" tuiButton type="submit">Guardar</button>
	</form>

	<section class="claim-book-page__json">
		<span>{{ form().value() | json }}</span>
	</section>
</div>
